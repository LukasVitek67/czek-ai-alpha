<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'">
  <title>Otevřít projekt</title>
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; margin: 0; background: var(--bg); }
    .pk-top { display: flex; gap: 8px; padding: 14px 16px 10px; border-bottom: 1px solid var(--rule); }
    .pk-top input {
      flex: 1; min-width: 0; padding: 6px 10px; border: 1px solid var(--rule); border-radius: 5px;
      background: var(--panel); color: var(--text); font: inherit;
    }
    .pk-list { flex: 1; overflow-y: auto; padding: 4px 0 10px; }
    .pk-h { display: flex; align-items: baseline; justify-content: space-between; padding: 12px 16px 4px; font-size: 12px; color: var(--muted); }
    .pk-row {
      display: flex; align-items: center; gap: 10px; padding: 6px 16px; cursor: default; outline: none;
    }
    .pk-row:hover, .pk-row.sel { background: var(--sel); }
    .pk-row .tx { flex: 1; min-width: 0; }
    .pk-row .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pk-row .pa { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pk-row .acts { display: none; gap: 4px; }
    .pk-row:hover .acts, .pk-row.sel .acts { display: flex; }
    .pk-multi { font-size: 12px; color: var(--warn); margin-top: 3px; white-space: normal; }
    .pk-multi .link { font-size: 12px; margin-right: 6px; }
    .pk-empty { padding: 6px 16px; color: var(--muted); font-size: 13px; }
    .pk-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--rule); }
    .pk-foot .hint { font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="pk-top">
    <input id="q" type="text" data-i18n-ph="picker.search" autocomplete="off" spellcheck="false">
    <button id="browse" class="btn primary" data-i18n="picker.browse">Procházet…</button>
  </div>
  <div class="pk-list" id="list"></div>
  <div class="pk-foot">
    <button id="addPinned" class="link" data-i18n="picker.addQuick">Přidat složku do rychlého přístupu…</button>
    <span class="hint" data-i18n="picker.hint">Enter otevře · Esc zavře</span>
  </div>
  <script src="../i18n.js"></script>
  <script src="picker.js"></script>
</body>
</html>
