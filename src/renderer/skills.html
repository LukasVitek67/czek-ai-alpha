<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'">
  <title>Skills a návody</title>
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; margin: 0; background: var(--bg); }
    .sk-top { padding: 18px 28px 12px; border-bottom: 1px solid var(--rule); }
    .sk-top h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; }
    .sk-top .lead { color: var(--muted); font-size: 13px; margin: 0 0 12px; max-width: 760px; line-height: 1.5; }
    .sk-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .sk-bar input { flex: 1; min-width: 200px; padding: 6px 10px; border: 1px solid var(--rule); border-radius: 5px; background: var(--panel); color: var(--text); font: inherit; }
    .sk-count { font-size: 12px; color: var(--muted); }
    .sk-body { flex: 1; overflow-y: auto; padding: 4px 28px 40px; }
    .sk-howto { max-width: 860px; margin: 14px 0 6px; font-size: 13px; line-height: 1.55; color: var(--text); }
    .sk-howto summary { cursor: pointer; font-weight: 600; }
    .sk-howto ol { margin: 6px 0 0 18px; padding: 0; }
    .sk-howto code, .sk-guide code { font-family: var(--mono); font-size: 12px; background: var(--code); padding: 1px 4px; border-radius: 3px; }
    .sk-group { max-width: 860px; font-size: 12px; color: var(--muted); margin: 22px 0 4px; font-weight: 600; }
    .sk-row { max-width: 860px; display: grid; grid-template-columns: 64px 220px 1fr auto auto; gap: 12px; align-items: center; padding: 7px 4px; border-bottom: 1px solid var(--rule); cursor: pointer; }
    .sk-row:hover, .sk-row.open { background: var(--sel); }
    .sk-impact { height: 3px; border-radius: 2px; background: var(--muted); opacity: .75; }
    .sk-name { font-family: var(--mono); font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sk-sum { font-size: 13px; color: var(--muted); min-width: 0; }
    .sk-badge { font-size: 11px; color: var(--muted); border: 1px solid var(--rule); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
    .sk-st { font-size: 11.5px; white-space: nowrap; }
    .sk-st.on { color: var(--accent); }
    .sk-st.ext { color: var(--muted); }
    .sk-st.bad { color: var(--err); }
    .sk-guide { max-width: 860px; padding: 10px 4px 16px 76px; border-bottom: 1px solid var(--rule); font-size: 13.5px; line-height: 1.55; }
    .sk-guide h3 { font-size: 12px; color: var(--muted); font-weight: 600; margin: 12px 0 3px; }
    .sk-guide h3:first-child { margin-top: 0; }
    .sk-guide ul { margin: 0 0 0 18px; padding: 0; }
    .sk-ex { display: flex; gap: 8px; align-items: flex-start; margin: 4px 0; }
    .sk-ex .t { flex: 1; font-family: var(--mono); font-size: 12px; background: var(--code); border-radius: 4px; padding: 6px 8px; white-space: pre-wrap; }
    .sk-note { color: var(--warn); }
    .sk-src { font-size: 12px; color: var(--muted); }
    @media (max-width: 720px) {
      .sk-row { grid-template-columns: 40px 1fr auto; }
      .sk-row .sk-sum, .sk-row .sk-badge { display: none; }
      .sk-guide { padding-left: 8px; }
    }
  </style>
</head>
<body>
  <div class="sk-top">
    <h1 data-i18n="skills.title">Skills a návody</h1>
    <p class="lead" data-i18n="skills.intro"></p>
    <div class="sk-bar">
      <input id="q" type="text" data-i18n-ph="skills.search" autocomplete="off" spellcheck="false">
      <span class="sk-count" id="count"></span>
      <button class="btn small" id="folder" data-i18n="skills.openFolder">Otevřít složku skills</button>
      <button class="btn small" id="resync" data-i18n="skills.resync">Znovu nainstalovat</button>
    </div>
  </div>
  <div class="sk-body" id="body">
    <details class="sk-howto" open>
      <summary data-i18n="skills.howTitle">Jak skills v OpenCode použít</summary>
      <ol>
        <li data-i18n-html="skills.how1"></li>
        <li data-i18n-html="skills.how2"></li>
        <li data-i18n-html="skills.how3"></li>
      </ol>
    </details>
    <div id="list"></div>
  </div>
  <script src="../i18n.js"></script>
  <script src="skills.js"></script>
</body>
</html>
